# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"
# Inserts a blank line between shell prompts
format = """
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$ruby\
$python\t
$character"""
add_newline = false

[directory]
truncate_to_repo = false
truncation_length = 5
truncation_symbol = "../"
